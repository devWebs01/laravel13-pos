name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            composer:
              - 'composer.lock'
            node:
              - 'package-lock.json'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, pdo_mysql, gd, intl, zip
          tools: composer:v2

      - name: Cache Composer global cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-cache-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: vendor-${{ runner.os }}-

      - name: Install PHP dependencies
        run: |
          if [ "${{ steps.changes.outputs.composer }}" = "true" ] || [ ! -f vendor/autoload.php ]; then
            composer install --no-dev --optimize-autoloader --no-interaction
          fi

      - name: Validate Composer
        if: steps.changes.outputs.composer == 'true'
        run: composer validate --strict

      - name: Check platform requirements
        if: steps.changes.outputs.composer == 'true'
        run: composer check-platform-reqs

      - name: Dump optimized autoload
        if: steps.changes.outputs.composer == 'true'
        run: composer dump-autoload -o

      - name: Verify vendor autoload
        run: test -f vendor/autoload.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build assets
        run: |
          if [ "${{ steps.changes.outputs.node }}" = "true" ] || [ ! -f public/build/manifest.json ]; then
            npm ci
            npm run build
          fi

      - name: Verify build output
        if: steps.changes.outputs.node == 'true'
        run: test -f public/build/manifest.json

      - name: Prepare deployment structure
        run: |
          mkdir -p deploy/htdocs/public deploy/htdocs/laravel_app

          # Copy all source code into laravel_app/
          rsync -a --exclude='deploy' --exclude='.git' --exclude='.github' --exclude='.ddev' --exclude='.agents' --exclude='.ai' --exclude='node_modules' --exclude='tests' --exclude='storage/app' --exclude='storage/debugbar' --exclude='storage/logs' --exclude='storage/framework' --exclude='.php-version' --exclude='.deployignore' --exclude='.devdbrc' --exclude='.lerd.yaml' --exclude='.env.deploy.example' --exclude='.env.deploy' --exclude='AGENTS.md' --exclude='docs' --exclude='bootstrap/cache' . deploy/htdocs/laravel_app/

          # Copy public/ to htdocs/public/
          rsync -a public/ deploy/htdocs/public/

          # Cleanup file tak perlu dari laravel_app/
          rm -f deploy/htdocs/laravel_app/.editorconfig deploy/htdocs/laravel_app/.env.example \
                deploy/htdocs/laravel_app/.gitattributes deploy/htdocs/laravel_app/.gitignore \
                deploy/htdocs/laravel_app/README.md deploy/htdocs/laravel_app/postcss.config.js \
                deploy/htdocs/laravel_app/phpunit.xml deploy/htdocs/laravel_app/package.json \
                deploy/htdocs/laravel_app/tailwind.config.js deploy/htdocs/laravel_app/vite.config.js \
                deploy/htdocs/laravel_app/CHANGELOG.md deploy/htdocs/laravel_app/DEPLOY-GUIDE.md \
                deploy/htdocs/laravel_app/DEPLOY-PROMPT.md deploy/htdocs/laravel_app/.env.deploy.example \
                deploy/htdocs/laravel_app/.deployignore deploy/htdocs/laravel_app/.devdbrc \
                deploy/htdocs/laravel_app/.lerd.yaml deploy/htdocs/laravel_app/AGENTS.md
          rm -rf deploy/htdocs/laravel_app/.agents deploy/htdocs/laravel_app/.ai deploy/htdocs/laravel_app/tests deploy/htdocs/laravel_app/cache deploy/htdocs/laravel_app/docs 2>/dev/null || true

          # Ensure storage directories exist
          mkdir -p deploy/htdocs/laravel_app/storage/app/public
          mkdir -p deploy/htdocs/laravel_app/storage/framework/cache
          mkdir -p deploy/htdocs/laravel_app/storage/framework/sessions
          mkdir -p deploy/htdocs/laravel_app/storage/framework/views
          mkdir -p deploy/htdocs/laravel_app/storage/logs
          mkdir -p deploy/htdocs/laravel_app/bootstrap/cache

          # Root .htaccess — rewrite ke public, kecualikan public/ dan laravel_app/
          cat > deploy/htdocs/.htaccess << 'HTACCESS'
          <IfModule mod_rewrite.c>
              RewriteEngine On

              RewriteCond %{REQUEST_URI} !^/public/
              RewriteCond %{REQUEST_URI} !^/laravel_app/

              RewriteRule ^$ public/ [L]

              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteRule ^(.*)$ public/$1 [L]
          </IfModule>
          HTACCESS

          # Block direct access to laravel_app/
          cat > deploy/htdocs/laravel_app/.htaccess << 'DENY'
          <IfModule mod_authz_core.c>
              Require all denied
          </IfModule>
          DENY

      - name: Create .env for production
        run: |
          cat > deploy/htdocs/laravel_app/.env << EOF
          APP_NAME="POS-DW"
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=https://pos-dw.site.je

          APP_LOCALE=id
          APP_FALLBACK_LOCALE=id
          APP_FAKER_LOCALE=id_ID

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          CACHE_DRIVER=file
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          FILESYSTEM_DISK=local

          MAIL_MAILER=smtp
          MAIL_HOST=smtp.gmail.com
          MAIL_PORT=587
          MAIL_USERNAME=null
          MAIL_PASSWORD=null
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS="noreply@pos-dw.site.je"
          MAIL_FROM_NAME="\${APP_NAME}"

          APP_KEY=${{ secrets.APP_KEY }}

          VITE_APP_NAME="\${APP_NAME}"
          EOF

      - name: Cache Laravel config & routes
        run: |
          cd deploy/htdocs/laravel_app
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache

      - name: Verify deployment package
        run: |
          test -f deploy/htdocs/public/index.php
          test -f deploy/htdocs/laravel_app/artisan
          test -f deploy/htdocs/laravel_app/vendor/autoload.php
          test -f deploy/htdocs/laravel_app/.env
          test -f deploy/htdocs/.htaccess
          test -f deploy/htdocs/public/build/manifest.json
          echo "Deployment package OK"

      - name: Cleanup sisa Softaculous di server
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          BASE="ftp://ftpupload.net/pos-dw.site.je/htdocs"
          AUTH="if0_39773534:${FTP_PASS}"
          for f in \
            README.md .editorconfig .env.example .env.deploy.example .gitattributes .gitignore \
            postcss.config.js phpunit.xml package.json tailwind.config.js \
            vite.config.js CHANGELOG.md DEPLOY-GUIDE.md DEPLOY-PROMPT.md \
            public/favicon.ico public/robots.txt .deployignore .devdbrc .lerd.yaml AGENTS.md
          do
            curl -s -u "$AUTH" "$BASE/" -Q "DELE $f" >/dev/null 2>&1 || true
          done
          for d in cache
          do
            curl -s -u "$AUTH" "$BASE/" -Q "RMD $d" >/dev/null 2>&1 || true
          done
          echo "Cleanup selesai"

      - name: Create directories di server
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          TMP=$(mktemp)
          # Collect parent dirs from public/ + laravel_app/ (non-vendor)
          find deploy/htdocs/public deploy/htdocs/laravel_app -type f -not -path '*/vendor/*' | sort \
            | while IFS= read -r f; do
            rel="${f#deploy/htdocs/}"
            case "$rel" in
              laravel_app/docs/*|laravel_app/bootstrap/cache/*|laravel_app/storage/logs/*|laravel_app/storage/debugbar/*|laravel_app/storage/framework/cache/*|laravel_app/storage/framework/sessions/*|laravel_app/storage/framework/views/*|laravel_app/storage/framework/testing/*|laravel_app/.editorconfig|laravel_app/.gitattributes|laravel_app/.gitignore|laravel_app/README.md|laravel_app/.env.example|laravel_app/.env.deploy.example|laravel_app/phpunit.xml|laravel_app/postcss.config.js|laravel_app/package.json|laravel_app/tailwind.config.js|laravel_app/vite.config.js|laravel_app/CHANGELOG.md|laravel_app/DEPLOY-GUIDE.md|laravel_app/DEPLOY-PROMPT.md|laravel_app/.deployignore|laravel_app/.devdbrc|laravel_app/.lerd.yaml|laravel_app/AGENTS.md)
                continue ;;
            esac
            dir=$(dirname "$rel")
            [ "$dir" = "." ] && continue
            echo "$dir"
          done > "$TMP"
          # Also include vendor subdirs (for when composer.lock changes)
          find deploy/htdocs/laravel_app/vendor -type d | sed 's|^deploy/htdocs/||' >> "$TMP"

          while IFS= read -r full; do
            parts=(${full//\// })
            current=""
            for part in "${parts[@]}"; do
              current="${current:+${current}/}${part}"
              echo "$current"
            done
          done < "$TMP" | sort -u > "${TMP}2"

          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            curl -s --connect-timeout 15 \
              -u "if0_39773534:${FTP_PASS}" \
              "ftp://ftpupload.net/pos-dw.site.je/htdocs/" \
              -Q "CWD pos-dw.site.je" -Q "CWD htdocs" \
              -Q "MKD $dir" >/dev/null 2>&1 || true
          done < "${TMP}2"
          rm -f "$TMP" "${TMP}2"
          echo "Dir preparation selesai"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via lftp
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          EXCLUDE_VENDOR=""
          if [ "${{ steps.changes.outputs.composer }}" = "false" ]; then
            EXCLUDE_VENDOR="-X laravel_app/vendor"
          fi
          lftp -e "
            set ftp:auto-create-dirs false
            set net:max-retries 3
            set ftp:passive-mode true
            mirror --reverse --delete --verbose \
              -X laravel_app/docs \
              -X laravel_app/bootstrap/cache \
              -X laravel_app/storage/logs \
              -X laravel_app/storage/framework/cache \
              -X laravel_app/storage/framework/sessions \
              -X laravel_app/storage/framework/views \
              -X laravel_app/storage/framework/testing \
              -X laravel_app/.editorconfig \
              -X laravel_app/.gitattributes \
              -X laravel_app/.gitignore \
              -X laravel_app/README.md \
              -X laravel_app/.env.example \
              -X laravel_app/.deployignore \
              -X laravel_app/.devdbrc \
              -X laravel_app/.lerd.yaml \
              -X laravel_app/AGENTS.md \
              -X laravel_app/.ai \
              -X laravel_app/.agents \
              $EXCLUDE_VENDOR \
              deploy/htdocs/ \
              pos-dw.site.je/htdocs/
            quit
          " -u "if0_39773534:${FTP_PASS}" ftp://ftpupload.net

      - name: Health check
        run: |
          sleep 15
          curl --retry 5 --retry-delay 5 -sf -o /dev/null -w '%{http_code}' https://pos-dw.site.je || exit 1
