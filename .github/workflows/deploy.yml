name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            composer:
              - 'composer.lock'
            node:
              - 'package-lock.json'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, pdo_mysql, gd, intl, zip
          tools: composer:v2

      - name: Cache Composer global cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-cache-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: vendor-${{ runner.os }}-

      - name: Install PHP dependencies
        run: |
          if [ "${{ steps.changes.outputs.composer }}" = "true" ] || [ ! -f vendor/autoload.php ]; then
            composer install --no-dev --optimize-autoloader --no-interaction
          fi

      - name: Validate Composer
        if: steps.changes.outputs.composer == 'true'
        run: composer validate --strict

      - name: Check platform requirements
        if: steps.changes.outputs.composer == 'true'
        run: composer check-platform-reqs

      - name: Dump optimized autoload
        if: steps.changes.outputs.composer == 'true'
        run: composer dump-autoload -o

      - name: Verify vendor autoload
        run: test -f vendor/autoload.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build assets
        run: |
          if [ "${{ steps.changes.outputs.node }}" = "true" ] || [ ! -f public/build/manifest.json ]; then
            npm ci
            npm run build
          fi

      - name: Verify build output
        if: steps.changes.outputs.node == 'true'
        run: test -f public/build/manifest.json

      - name: Prepare deployment structure
        run: |
          mkdir -p deploy/htdocs

          # Copy all project files (including public/) into deploy/htdocs/
          rsync -a --exclude='deploy' --exclude='.git' --exclude='.github' --exclude='.ddev' --exclude='node_modules' --exclude='tests' --exclude='storage/app' --exclude='storage/debugbar' --exclude='storage/logs' --exclude='storage/framework/cache/data' --exclude='.php-version' . deploy/htdocs/

          # Merge public/ assets into root for direct static serving
          rsync -a public/ deploy/htdocs/

          # Hapus file repo yang tidak perlu dari deploy
          rm -f deploy/htdocs/.editorconfig deploy/htdocs/.env.example \
                deploy/htdocs/.gitattributes deploy/htdocs/.gitignore \
                deploy/htdocs/README.md deploy/htdocs/postcss.config.js \
                deploy/htdocs/phpunit.xml deploy/htdocs/package.json \
                deploy/htdocs/tailwind.config.js deploy/htdocs/vite.config.js \
                deploy/htdocs/CHANGELOG.md deploy/htdocs/DEPLOY-GUIDE.md \
                deploy/htdocs/DEPLOY-PROMPT.md
          rm -rf deploy/htdocs/tests deploy/htdocs/cache 2>/dev/null || true

          # Ensure storage directories exist
          mkdir -p deploy/htdocs/storage/app/public
          mkdir -p deploy/htdocs/storage/framework/cache
          mkdir -p deploy/htdocs/storage/framework/sessions
          mkdir -p deploy/htdocs/storage/framework/views
          mkdir -p deploy/htdocs/storage/logs
          mkdir -p deploy/htdocs/bootstrap/cache

          # .htaccess — rewrite internal ke public/index.php + handle root URL
          cat > deploy/htdocs/.htaccess << 'HTACCESS'
          <IfModule mod_rewrite.c>
              RewriteEngine On

              RewriteRule "(^|/)\." - [F]

              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_URI} (.+)/$
              RewriteRule ^ %1 [L,R=301]

              RewriteRule ^$ public/index.php [L]

              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteRule ^ public/index.php [L]
          </IfModule>
          HTACCESS

      - name: Create .env for production
        run: |
          cat > deploy/htdocs/.env << EOF
          APP_NAME="POS-DW"
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=https://pos-dw.site.je

          APP_LOCALE=id
          APP_FALLBACK_LOCALE=id
          APP_FAKER_LOCALE=id_ID

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          CACHE_DRIVER=file
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          FILESYSTEM_DISK=local

          MAIL_MAILER=smtp
          MAIL_HOST=smtp.gmail.com
          MAIL_PORT=587
          MAIL_USERNAME=null
          MAIL_PASSWORD=null
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS="noreply@pos-dw.site.je"
          MAIL_FROM_NAME="\${APP_NAME}"

          APP_KEY=${{ secrets.APP_KEY }}

          VITE_APP_NAME="\${APP_NAME}"
          EOF

      - name: Cache Laravel config & routes
        run: |
          cd deploy/htdocs
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache

      - name: Verify deployment package
        run: |
          test -f deploy/htdocs/public/index.php
          test -f deploy/htdocs/artisan
          test -f deploy/htdocs/vendor/autoload.php
          test -f deploy/htdocs/.env
          test -f deploy/htdocs/.htaccess
          test -f deploy/htdocs/build/manifest.json
          echo "Deployment package OK"

      - name: Deploy via FTP (find + curl)
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          i=0
          find deploy/htdocs -type f | while IFS= read -r f; do
            rel="${f#deploy/htdocs/}"
            case "$rel" in
              .git/*|node_modules/*|.editorconfig|.gitattributes|.gitignore|README.md|.env.example|phpunit.xml|postcss.config.js|package.json|tailwind.config.js|vite.config.js|CHANGELOG.md|DEPLOY-GUIDE.md|DEPLOY-PROMPT.md|storage/logs/*|storage/debugbar/*|storage/framework/cache/data/*)
                continue ;;
            esac
            curl -s --connect-timeout 30 --retry 3 --ftp-create-dirs \
              -u "if0_39773534:${FTP_PASS}" \
              -T "$f" "ftp://ftpupload.net/pos-dw.site.je/htdocs/${rel}" &
            if [ $((++i % 10)) -eq 0 ]; then wait; fi
          done
          wait
          echo "Deploy selesai"

      - name: Health check
        run: |
          sleep 10
          curl -sf -o /dev/null -w '%{http_code}' https://pos-dw.site.je || exit 1
