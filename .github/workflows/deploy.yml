name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            composer:
              - 'composer.lock'
            node:
              - 'package-lock.json'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, pdo_mysql, gd, intl, zip
          tools: composer:v2

      - name: Cache Composer global cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-cache-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: vendor-${{ runner.os }}-

      - name: Install PHP dependencies
        run: |
          if [ "${{ steps.changes.outputs.composer }}" = "true" ] || [ ! -f vendor/autoload.php ]; then
            composer install --no-dev --optimize-autoloader --no-interaction
          fi

      - name: Validate Composer
        if: steps.changes.outputs.composer == 'true'
        run: composer validate --strict

      - name: Check platform requirements
        if: steps.changes.outputs.composer == 'true'
        run: composer check-platform-reqs

      - name: Dump optimized autoload
        if: steps.changes.outputs.composer == 'true'
        run: composer dump-autoload -o

      - name: Verify vendor autoload
        run: test -f vendor/autoload.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build assets
        run: |
          if [ "${{ steps.changes.outputs.node }}" = "true" ] || [ ! -f public/build/manifest.json ]; then
            npm ci
            npm run build
          fi

      - name: Verify build output
        if: steps.changes.outputs.node == 'true'
        run: test -f public/build/manifest.json

      - name: Prepare deployment structure
        run: |
          mkdir -p deploy/htdocs/laravel

          # Move Laravel source (excluding public/) into htdocs/laravel/
           rsync -a --exclude='public' --exclude='deploy' --exclude='.git' --exclude='.github' --exclude='.ddev' --exclude='node_modules' --exclude='tests' --exclude='storage/app' --exclude='storage/debugbar' --exclude='storage/logs' --exclude='storage/framework/cache/data' --exclude='.php-version' . deploy/htdocs/laravel/

          # Ensure storage directories exist
          mkdir -p deploy/htdocs/laravel/storage/app/public
          mkdir -p deploy/htdocs/laravel/storage/framework/cache
          mkdir -p deploy/htdocs/laravel/storage/framework/sessions
          mkdir -p deploy/htdocs/laravel/storage/framework/views
          mkdir -p deploy/htdocs/laravel/storage/logs
          mkdir -p deploy/htdocs/laravel/bootstrap/cache

          # Move public/ contents into htdocs/
          rsync -a public/ deploy/htdocs/

          # Create optimized htdocs/index.php that loads Laravel from laravel/
          cp .github/deploy-scripts/htdocs-index.php deploy/htdocs/index.php

          # Overwrite .htaccess with minimal version for compatibility
          cat > deploy/htdocs/.htaccess << 'HTACCESS'
          <IfModule mod_rewrite.c>
              RewriteEngine On

              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteRule ^ index.php [L]
          </IfModule>
          HTACCESS

      - name: Create .env for production
        run: |
          cat > deploy/htdocs/laravel/.env << EOF
          APP_NAME="POS-DW"
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=https://pos-dw.site.je

          APP_LOCALE=id
          APP_FALLBACK_LOCALE=id
          APP_FAKER_LOCALE=id_ID

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          CACHE_DRIVER=file
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          FILESYSTEM_DISK=local

          MAIL_MAILER=smtp
          MAIL_HOST=smtp.gmail.com
          MAIL_PORT=587
          MAIL_USERNAME=null
          MAIL_PASSWORD=null
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS="noreply@pos-dw.site.je"
          MAIL_FROM_NAME="\${APP_NAME}"

          APP_KEY=${{ secrets.APP_KEY }}

          VITE_APP_NAME="\${APP_NAME}"
          EOF

      - name: Cache Laravel config & routes
        run: |
          cd deploy/htdocs/laravel
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache

      - name: Verify deployment package
        run: |
          test -f deploy/htdocs/index.php
          test -f deploy/htdocs/laravel/artisan
          test -f deploy/htdocs/laravel/vendor/autoload.php
          test -f deploy/htdocs/laravel/.env
          test -f deploy/htdocs/.htaccess
          test -f deploy/htdocs/build/manifest.json
          echo "Deployment package OK"

      - name: Clean up old _core folder on server
        run: |
          curl -s -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            ftp://ftpupload.net/pos-dw.site.je/htdocs/ \
            -Q "RMD _core" || true

      - name: Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpupload.net
          username: if0_39773534
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: deploy/htdocs/
          server-dir: pos-dw.site.je/htdocs/
          protocol: ftp
          port: 21
          security: loose
          log-level: minimal
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.editorconfig
            **/.gitattributes
            **/README.md
            **/.env.example
            **/phpunit.xml
            **/CHANGELOG.md
            **/DEPLOY-GUIDE.md
            **/DEPLOY-PROMPT.md
            **/storage/logs/**
            **/storage/debugbar/**
            **/storage/framework/cache/data/**

      - name: Health check
        run: |
          sleep 10
          curl -sf -o /dev/null -w '%{http_code}' https://pos-dw.site.je || exit 1
